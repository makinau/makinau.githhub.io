<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llista de la compra - Makinau</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #203229;
      --muted: #6a796f;
      --line: #dce5de;
      --paper: #fff;
      --canvas: #f1f5f1;
      --green: #246448;
      --green-hover: #194f37;
      --red: #a63f36;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 28px 20px; background: var(--canvas); color: var(--ink); }
    main { width: min(100%, 660px); margin: 0 auto; }
    a, button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled, input:disabled { cursor: wait; opacity: .65; }
    a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid #e3a33c; outline-offset: 3px;
    }

    .back-link { display: inline-flex; align-items: center; margin: 0 0 34px; color: var(--green); font-size: 14px; font-weight: 650; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .page-header { margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: 1px; text-transform: uppercase; }
    h1 { margin: 0; font-size: 32px; line-height: 1.15; }
    .muted { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

    .add-form { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 8px; margin-bottom: 28px; }
    input[type="text"] { width: 100%; min-width: 0; min-height: 48px; padding: 0 14px; border: 1px solid #c9d6cd; border-radius: 5px; background: var(--paper); color: var(--ink); }
    input[type="text"]::placeholder { color: #87958c; }
    .icon-button { display: inline-grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; padding: 8px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: #53665a; }
    .icon-button:hover { background: #e4ede6; color: var(--ink); }
    .icon-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .add-button { width: 48px; height: 48px; border: 0; border-radius: 5px; background: var(--green); color: white; }
    .add-button:hover { background: var(--green-hover); }
    .add-button svg { width: 21px; height: 21px; }

    .list-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 0 10px; border-bottom: 1px solid var(--line); }
    .list-heading h2 { margin: 0; font-size: 17px; }
    .item-count { color: var(--muted); font-size: 13px; }
    .shopping-item { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); }
    .item-check { width: 18px; height: 18px; margin: 0; accent-color: var(--green); cursor: pointer; }
    .item-content { min-width: 0; padding: 10px 0; }
    .item-name { overflow-wrap: anywhere; font-size: 15px; }
    .shopping-item.done .item-name { color: var(--muted); text-decoration: line-through; }
    .item-actions { display: flex; align-items: center; gap: 2px; }
    .icon-button.danger { color: var(--red); }
    .icon-button.danger:hover { background: #f8e9e6; }
    .edit-form { display: flex; gap: 6px; }
    .edit-form input { min-height: 40px; padding: 0 10px; }
    .edit-actions { display: flex; gap: 2px; }
    .empty { margin: 0; padding: 24px 0; color: var(--muted); font-size: 14px; }
    .status { min-height: 20px; margin: 10px 0 0; color: var(--red); font-size: 13px; }

    .item-tags { margin-top: 5px; }
    .item-tags summary { width: fit-content; color: var(--green); font-size: 12px; cursor: pointer; }
    .tags, .tag-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .tag { padding: 3px 7px; border-radius: 3px; background: #e9f1eb; color: #3d5c49; font-size: 11px; }
    .tag-options label { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; }
    .tag-options input { accent-color: var(--green); }

    .settings { margin-top: 28px; border-top: 1px solid var(--line); }
    .settings summary { padding: 14px 0; color: var(--green); font-size: 14px; font-weight: 650; cursor: pointer; }
    .settings-content { padding: 0 0 16px; }
    .settings-content h2 { margin: 0 0 10px; font-size: 14px; }
    .store-form { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 7px; }
    .store-form input[type="text"] { min-height: 40px; }
    .store-form .icon-button { width: 40px; height: 40px; border-color: var(--line); background: white; }
    .store-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .store-chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 4px 3px 9px; border: 1px solid var(--line); border-radius: 4px; background: white; color: var(--ink); font-size: 12px; }
    .store-chip .icon-button { width: 27px; height: 27px; padding: 5px; }

    #shopping-app[hidden], #auth-status[hidden] { display: none; }
    #auth-status { margin-top: 24px; padding: 14px 0; border-block: 1px solid var(--line); }
    #auth-status .muted { margin: 0; }
    #auth-link { display: inline-block; margin-top: 10px; color: var(--green); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 480px) {
      body { padding: 20px 16px; }
      .back-link { margin-bottom: 28px; }
      h1 { font-size: 28px; }
      .shopping-item { grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; }
      .icon-button { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../← Tornar a l’inici</a>
    <header class="page-header">
      <p class="eyebrow">Compra compartida</p>
      <h1>Llista de la compra</h1>
      <p class="muted">Marca el que ja has trobat.</p>
    </header>

    <section id="auth-status" aria-live="polite">
      <p id="auth-message" class="muted">Comprovant la sessió d’OurHouse…</p>
      <a id="auth-link" href="https://makinau.github.io/OurHouse/" target="_blank" rel="noopener noreferrer" hidden>Inicia sessió a OurHouse i torna a aquesta pàgina</a>
    </section>

    <div id="shopping-app" hidden>
      <form id="item-form" class="add-form">
        <input id="item-name" type="text" maxlength="120" placeholder="Afegeix un article…" aria-label="Nom de l’article" required>
        <button class="icon-button add-button" type="submit" title="Afegir article" aria-label="Afegir article">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </form>

      <section aria-labelledby="list-heading">
        <div class="list-heading">
          <h2 id="list-heading">Articles</h2>
          <span id="item-count" class="item-count"></span>
        </div>
        <div id="items-list"></div>
        <p id="empty-message" class="empty">Encara no hi ha articles. Afegeix-ne un per començar.</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <details class="settings">
        <summary>Establiments i etiquetes</summary>
        <div class="settings-content">
          <h2>Gestiona els establiments</h2>
          <form id="store-form" class="store-form">
            <input id="store-name" type="text" maxlength="40" placeholder="Ex.: Mercat" aria-label="Nom de l’establiment" required>
            <button class="icon-button" type="submit" title="Afegir establiment" aria-label="Afegir establiment">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
          </form>
          <div id="store-list" class="store-list" aria-label="Establiments desats"></div>
        </div>
      </details>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if (!window.supabase?.createClient) {
      document.querySelector("#auth-message").textContent = "No s’ha pogut carregar el client de Supabase.";
      throw new Error("El client de Supabase no està disponible.");
    }

    const SUPABASE_URL = "https://ervlgxziksargjncwogu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_RmLqHIC7mZ_YnVJyxFHQxg_4ziCyTgl";
    const SHOPPING_ITEMS_TABLE = "shopping_items";
    const SHOPPING_STORES_TABLE = "shopping_stores";
    const ITEM_STORES_TABLE = "shopping_item_stores";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { storage: window.localStorage, persistSession: true, autoRefreshToken: true }
    });
    const itemForm = document.querySelector("#item-form");
    const itemNameInput = document.querySelector("#item-name");
    const storeForm = document.querySelector("#store-form");
    const storeNameInput = document.querySelector("#store-name");
    const storeList = document.querySelector("#store-list");
    const itemsList = document.querySelector("#items-list");
    const emptyMessage = document.querySelector("#empty-message");
    const itemCount = document.querySelector("#item-count");
    const status = document.querySelector("#status");
    const authStatus = document.querySelector("#auth-status");
    const authMessage = document.querySelector("#auth-message");
    const authLink = document.querySelector("#auth-link");
    const shoppingApp = document.querySelector("#shopping-app");
    let data = { items: [], stores: [] };
    let currentUserId = null;
    let busy = false;
    let editingItemId = null;

    const iconMarkup = {
      edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 4 4 4"/><path d="m14 6-9 9-1 5 5-1 9-9"/><path d="m13 7 4 4"/></svg>',
      delete: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>',
      save: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>',
      cancel: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>'
    };

    function createIconButton(icon, label, className = "") {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `icon-button ${className}`.trim();
      button.title = label;
      button.setAttribute("aria-label", label);
      button.innerHTML = iconMarkup[icon];
      return button;
    }

    function setBusy(value) {
      busy = value;
      shoppingApp.querySelectorAll("button, input").forEach((control) => {
        control.disabled = value;
      });
    }

    function checkResult(result) {
      if (result.error) throw result.error;
      return result.data;
    }

    async function loadData() {
      const requestedUserId = currentUserId;
      const [storeResult, itemResult, linkResult] = await Promise.all([
        supabaseClient.from(SHOPPING_STORES_TABLE).select("id, name").order("name"),
        supabaseClient.from(SHOPPING_ITEMS_TABLE).select("id, name, done, created_at").order("created_at"),
        supabaseClient.from(ITEM_STORES_TABLE).select("item_id, store_id")
      ]);
      const stores = checkResult(storeResult);
      const rows = checkResult(itemResult);
      const links = checkResult(linkResult);
      if (currentUserId !== requestedUserId) return;

      const storeIdsByItem = new Map();
      links.forEach(({ item_id, store_id }) => {
        const storeIds = storeIdsByItem.get(item_id) ?? [];
        storeIds.push(store_id);
        storeIdsByItem.set(item_id, storeIds);
      });
      data = {
        stores,
        items: rows.map((item) => ({
          ...item,
          stores: storeIdsByItem.get(item.id) ?? []
        }))
      };
      render();
    }

    function renderStores() {
      storeList.replaceChildren();
      data.stores.forEach((store) => {
        const chip = document.createElement("span");
        chip.className = "store-chip";
        const name = document.createElement("span");
        name.textContent = store.name;
        const remove = createIconButton("delete", `Eliminar l’etiqueta ${store.name}`, "danger");
        remove.addEventListener("click", () => {
          void runAction(async () => {
            checkResult(await supabaseClient.from(SHOPPING_STORES_TABLE).delete().eq("id", store.id));
          });
        });
        chip.append(name, remove);
        storeList.append(chip);
      });
    }

    function renderItems() {
      itemsList.replaceChildren();
      emptyMessage.hidden = data.items.length > 0;
      itemCount.textContent = `${data.items.length} ${data.items.length === 1 ? "article" : "articles"}`;

      data.items.forEach((item) => {
        const row = document.createElement("div");
        row.className = `shopping-item${item.done ? " done" : ""}`;

        const check = document.createElement("input");
        check.type = "checkbox";
        check.className = "item-check";
        check.checked = item.done;
        check.setAttribute("aria-label", `Marcar ${item.name} com a comprat`);
        check.addEventListener("change", () => {
          void runAction(async () => {
            checkResult(await supabaseClient.from(SHOPPING_ITEMS_TABLE).update({ done: check.checked }).eq("id", item.id));
          });
        });

        const content = document.createElement("div");
        content.className = "item-content";
        const actions = document.createElement("div");
        actions.className = "item-actions";

        if (editingItemId === item.id) {
          const editForm = document.createElement("form");
          editForm.className = "edit-form";
          const name = document.createElement("input");
          name.type = "text";
          name.maxLength = 120;
          name.value = item.name;
          name.setAttribute("aria-label", `Edita ${item.name}`);

          const editActions = document.createElement("div");
          editActions.className = "edit-actions";
          const save = createIconButton("save", `Desa ${item.name}`);
          save.addEventListener("click", () => {
            const value = name.value.trim();
            if (!value) {
              status.textContent = "Escriu un nom per a l’article.";
              name.focus();
              return;
            }
            void runAction(async () => {
              checkResult(await supabaseClient.from(SHOPPING_ITEMS_TABLE).update({ name: value }).eq("id", item.id));
              editingItemId = null;
            });
          });
          const cancel = createIconButton("cancel", "Cancel·la l’edició");
          cancel.addEventListener("click", () => {
            editingItemId = null;
            renderItems();
          });
          editActions.append(save, cancel);
          editForm.append(name, editActions);
          editForm.addEventListener("submit", (event) => {
            event.preventDefault();
            save.click();
          });
          content.append(editForm);
          requestAnimationFrame(() => name.focus());
        } else {
          const name = document.createElement("span");
          name.className = "item-name";
          name.textContent = item.name;
          content.append(name);

          const edit = createIconButton("edit", `Edita ${item.name}`);
          edit.addEventListener("click", () => {
            editingItemId = item.id;
            renderItems();
          });
          actions.append(edit);
        }

        if (item.stores.length) {
          const tags = document.createElement("div");
          tags.className = "tags";
          item.stores.forEach((storeId) => {
            const store = data.stores.find((entry) => entry.id === storeId);
            if (!store) return;
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = store.name;
            tags.append(tag);
          });
          content.append(tags);
        }

        if (data.stores.length) {
          const details = document.createElement("details");
          details.className = "item-tags";
          const summary = document.createElement("summary");
          summary.textContent = `Etiquetes (${item.stores.length})`;
          const options = document.createElement("div");
          options.className = "tag-options";
          data.stores.forEach((store) => {
            const label = document.createElement("label");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = item.stores.includes(store.id);
            checkbox.addEventListener("change", () => {
              void runAction(async () => {
                if (checkbox.checked) {
                  checkResult(await supabaseClient.from(ITEM_STORES_TABLE).insert({
                    item_id: item.id,
                    store_id: store.id
                  }));
                } else {
                  checkResult(await supabaseClient.from(ITEM_STORES_TABLE)
                    .delete()
                    .eq("item_id", item.id)
                    .eq("store_id", store.id));
                }
              });
            });
            label.append(checkbox, document.createTextNode(store.name));
            options.append(label);
          });
          details.append(summary, options);
          content.append(details);
        }

        const remove = createIconButton("delete", `Eliminar ${item.name}`, "danger");
        remove.addEventListener("click", () => {
          void runAction(async () => {
            checkResult(await supabaseClient.from(SHOPPING_ITEMS_TABLE).delete().eq("id", item.id));
          });
        });

        actions.append(remove);
        row.append(check, content, actions);
        itemsList.append(row);
      });
    }

    function render() {
      renderStores();
      renderItems();
      setBusy(busy);
    }

    async function runAction(action) {
      if (busy) return;
      setBusy(true);
      status.textContent = "Desant els canvis…";
      try {
        await action();
        await loadData();
        status.textContent = "";
      } catch (error) {
        status.textContent = `No s’han pogut desar els canvis: ${error.message}`;
      } finally {
        setBusy(false);
      }
    }

    itemForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (busy) return;
      const name = itemNameInput.value.trim();
      if (!name) return;
      void runAction(async () => {
        checkResult(await supabaseClient.from(SHOPPING_ITEMS_TABLE).insert({ name }));
        itemForm.reset();
        itemNameInput.focus();
      });
    });

    storeForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (busy) return;
      const name = storeNameInput.value.trim();
      if (!name) return;
      void runAction(async () => {
        checkResult(await supabaseClient.from(SHOPPING_STORES_TABLE).insert({ name }));
        storeForm.reset();
        storeNameInput.focus();
      });
    });

    async function updateSession(session) {
      const userId = session?.user?.id ?? null;
      if (!userId) {
        currentUserId = null;
        data = { items: [], stores: [] };
        shoppingApp.hidden = true;
        authStatus.hidden = false;
        authMessage.textContent = "Inicia sessió a OurHouse per veure i editar la llista compartida.";
        authLink.hidden = false;
        return;
      }

      if (userId === currentUserId) return;
      currentUserId = userId;
      authStatus.hidden = true;
      shoppingApp.hidden = false;
      status.textContent = "Carregant la llista compartida…";
      try {
        await loadData();
        if (currentUserId === userId) status.textContent = "";
      } catch (error) {
        if (currentUserId === userId) {
          status.textContent = `No s’ha pogut carregar la llista: ${error.message}`;
        }
      }
    }

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      queueMicrotask(() => {
        void updateSession(session);
      });
    });
  </script>
</body>
</html>
