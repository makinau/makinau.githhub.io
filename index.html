<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inici - Makinau</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-guard.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse at top, rgba(37, 99, 235, 0.18), transparent 55%),
        #0b1120;
      color: #e5e7eb;
    }

    .card {
      width: min(100%, 26rem);
      padding: clamp(1.75rem, 6vw, 2.5rem);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid #263248;
      border-radius: 1.25rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .page {
      width: min(100%, 26rem);
    }

    a.shopping-link {
      display: block;
      margin-bottom: 1rem;
      padding: 0.9rem 1rem;
      background: #dc2626;
      color: white;
      text-align: center;
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 0.75rem;
      font-weight: 700;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    a.shopping-link:hover {
      background-color: #b91c1c;
      transform: translateY(-2px);
    }

    a.shopping-link:focus-visible {
      outline: 3px solid #fca5a5;
      outline-offset: 3px;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      letter-spacing: -0.04em;
    }

    a.boto {
      display: block;
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.9rem 1rem;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 0.75rem;
      font-weight: 600;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    a.boto:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    a.boto.ourhouse {
      background-color: #16a34a;
    }

    a.boto.ourhouse:hover {
      background-color: #15803d;
    }

    a.boto:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    a.boto.ourhouse:focus-visible {
      outline-color: #86efac;
    }

    @media (prefers-reduced-motion: reduce) {
      a.boto {
        transition: none;
      }

      a.shopping-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Benvingut/da</h1>
      <a class="shopping-link" href="ShoppingList/shopping.html">🛒 Llista de la compra</a>
      <a class="boto ourhouse" href="https://makinau.github.io/OurHouse/">⌂ Entrar a OurHouse</a>
      <a class="boto" href="https://makinau.github.io/MyUni/">🎓 Entrar a MyUni</a>
      <a class="boto" href="Compartides/index.html">📤 Compartides</a>
    </div>
  </div>
</body>
</html>
